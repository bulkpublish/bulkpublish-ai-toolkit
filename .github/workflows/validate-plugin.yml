name: Validate plugin manifests

# The Cursor plugin was silently deleted once before, by an unrelated commit in
# another repo that moved the skills directory out from under it. This job fails
# the build if any manifest, the logo, or a referenced skill goes missing again.
#
# The check lives in this file rather than in a script: the Claude plugin
# directory accepts only Markdown, text, JSON, YAML and images from a community
# plugin, and nothing here downloads or installs anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Every manifest parses, every referenced path exists, versions agree
        shell: bash
        run: |
          node <<'JS'
          const fs = require('fs');
          const errors = [];
          const read = (p) => {
            try { return JSON.parse(fs.readFileSync(p, 'utf8')); }
            catch (e) { errors.push(`${p}: ${e.message}`); return null; }
          };
          const exists = (p, why) => { if (!fs.existsSync(p)) errors.push(`${why}: ${p} is missing`); };

          const claude = read('.claude-plugin/plugin.json');
          const cursor = read('.cursor-plugin/plugin.json');
          const claudeMarket = read('.claude-plugin/marketplace.json');
          const cursorMarket = read('.cursor-plugin/marketplace.json');
          read('.mcp.json');
          read('mcp.json');

          if (cursor) {
            exists(cursor.logo, 'Cursor logo');
            if (typeof cursor.mcpServers === 'string') exists(cursor.mcpServers, 'Cursor mcpServers');
            for (const dir of cursor.skills ?? []) exists(`${dir}/SKILL.md`, 'Cursor skill');
          }
          const listed = new Set((cursor?.skills ?? []).map((s) => s.replace(/^\.\//, '')));
          for (const dir of fs.readdirSync('skills', { withFileTypes: true })) {
            if (!dir.isDirectory()) continue;
            exists(`skills/${dir.name}/SKILL.md`, 'Skill folder without SKILL.md');
            // Cursor installs only the skills its manifest lists; a new folder
            // left off the list ships everywhere except Cursor, silently.
            if (cursor && !listed.has(`skills/${dir.name}`)) errors.push(`Cursor plugin does not list skills/${dir.name}`);
          }

          const versions = {
            '.claude-plugin/plugin.json': claude?.version,
            '.claude-plugin/marketplace.json': claudeMarket?.plugins?.[0]?.version,
            '.cursor-plugin/plugin.json': cursor?.version,
            '.cursor-plugin/marketplace.json': cursorMarket?.metadata?.version,
            'plugin.json': read('plugin.json')?.version,
            'gemini-extension.json': read('gemini-extension.json')?.version,
          };
          if (new Set(Object.values(versions)).size !== 1) {
            errors.push('Version drift: ' + JSON.stringify(versions));
          }

          if (errors.length) { for (const e of errors) console.error('ERROR ' + e); process.exit(1); }
          console.log('Manifests valid, all at ' + claude.version);
          JS
